name: DSH compatibility guardian

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .dsh-compat.yml
      - .dsh-compat.lock.json
      - compatibility/dsh-smoke.yml
      - .github/workflows/dsh-compat.yml

permissions:
  contents: read

jobs:
  guardian:
    # Replace both placeholders during onboarding. The ref must be a full commit SHA.
    uses: __GUARDIAN_REPOSITORY__/.github/workflows/guardian.yml@__GUARDIAN_FULL_SHA__
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      guardian_repository: __GUARDIAN_REPOSITORY__
      guardian_ref: __GUARDIAN_FULL_SHA__
      runner: ubuntu-24.04
    secrets:
      deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
      publisher_token: ${{ secrets.DSH_GUARDIAN_PUBLISH_TOKEN }}
      email_gateway_url: ${{ secrets.GUARDIAN_EMAIL_GATEWAY_URL }}
      telegram_bot_token: ${{ secrets.GUARDIAN_TELEGRAM_BOT_TOKEN }}
      telegram_chat_id: ${{ secrets.GUARDIAN_TELEGRAM_CHAT_ID }}
      notification_webhook_url: ${{ secrets.GUARDIAN_WEBHOOK_URL }}
