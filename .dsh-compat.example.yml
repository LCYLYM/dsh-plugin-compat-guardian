schema: 1

watch:
  registry: https://registry.npmjs.org
  package: "@deepseek-ai/dsh"
  channel: latest
  # 无需额外配置：版本号没变但实际安装内容变化时，会重跑完整兼容测试，但暂不调用维修模型。

repair:
  # 以下是产品默认值，仓库可覆盖；campaign 开始后会解析并锁定精确制品。
  dsh_version: "0.1.1-rc.2"
  # DSH provider id 与 wire model id，均可按仓库已有 provider 改写。
  provider: deepseek-official
  model: deepseek-v4-flash-vision-exp
  model_policy: pin-per-campaign
  # 检测和确定性复测立即执行；只有模型维修等待低价窗口。
  start_policy: low-price-window # immediate | low-price-window
  allow_manual_price_override: true
  max_attempts: 2
  # 普通仓库文件默认可修改，只保护控制面与独立验收面，不维护长 allowlist。
  protected_paths:
    - .github/workflows/**
    - .dsh-compat.yml
    - .dsh-compat.lock.json
    - compatibility/**

  # 这是 DSH 的独立 DeepSeek 搜索 provider，不是视觉模型自带的能力。
  # 默认同样使用视觉模型；若仓库覆盖，报告必须记录实际值，且不得静默回退。
  search:
    enabled: true
    model: deepseek-v4-flash-vision-exp
    # 默认提示词建议按需搜索官方标准/文档/源码；Guardian 不设置搜索专属次数上限。

credentials:
  # 这些是可配置的 env 引用；workflow 将同名 GitHub Actions secrets 映射给 DSH。
  # candidate 默认拿不到 key；只有已审核 contract 明确 requires_model_turn: true 时，
  # 才会在独立 smoke step 中临时使用同一个 Secret。
  api_key_env: DEEPSEEK_API_KEY
  # 可选；留空时使用 DSH/provider 的默认端点。
  base_url_env: DEEPSEEK_BASE_URL
  # 搜索使用 Anthropic 兼容端点，不自动复用 DEEPSEEK_BASE_URL。
  search_base_url_env: DEEPSEEK_SEARCH_BASE_URL

plugin:
  workspace: .
  package_json: package.json
  profile: web
  install_from: npm-pack
  surface: web

smoke:
  # onboarding 会从 manifest、源码、README 和现有测试生成机器断言。
  contract: compatibility/dsh-smoke.yml
  # 可选自然语言补充；留空时由 DSH 自行发现。
  hints: ""
  # 是否需要一次真实模型回合由已审核 contract 的 requires_model_turn 控制，默认 false。
  # contract 中 model_turn_scope 默认 candidate-only，可选 differential。
  # fixture_mode 默认 fixed，也可选 agent-selected；动态选中的文件会在本 campaign 内冻结。
  # 缺少所需 Secret 时结果是 BLOCKED；V1 不建设 ephemeral proxy。

gates:
  repository:
    - npm test
    - npm pack --dry-run
  # 该命令必须消费 Guardian 注入的真实 DSH_VERSION/DSH_HOME/DSH_WEB_URL。
  consumer:
    - npm run test:compat:dsh
  require_install_remove_roundtrip: true
  require_dump_config: true
  require_real_web_boot: true
  require_plugin_assertion: true

budget:
  scope: repository-target-version
  # MVP 累计 DSH/DeepSeek 实际暴露的 usage；缺少 usage 的辅助调用只记调用次数。
  # 不额外实现 OpenAI-compatible 账单解析器。
  max_tokens: 1000000
  max_cny: 10
  # 只累计实际 repair/verifier 运行；WAITING_FOR_PRICE 不计入。
  max_wall_minutes: 60
  converge_remaining_ratio: 0.30
  converge_message_enabled: true

pricing:
  # 这是可覆盖的官方默认快照；revision/source 会一并写入报告和 lock 证据。
  # 若 provider/model/base URL 改变且费率不同，应覆盖本节；否则仍统计 token，CNY 标 unknown。
  revision: deepseek-public-2026-08-21
  source: https://api-docs.deepseek.com/zh-cn/quick_start/pricing/
  applies_to:
    provider: deepseek-official
    model: deepseek-v4-flash-vision-exp
    base_url: https://api.deepseek.com
  currency: CNY
  unit: per_million_tokens
  timezone: Asia/Shanghai
  peak_windows:
    - start: "09:00"
      end: "12:00"
    - start: "14:00"
      end: "18:00"
  rates:
    peak:
      input_cache_hit: 0.10
      input_cache_miss: 3.00
      output: 9.00
    low_price:
      input_cache_hit: 0.05
      input_cache_miss: 1.50
      output: 4.50

delivery:
  mode: pull-request # pull-request | auto-merge | direct-push
  branch_prefix: automation/dsh-compat

notifications:
  github_summary: true
  github_issue_on_blocked: true
  email: false
  telegram: false
  webhook: false
